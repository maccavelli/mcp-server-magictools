name: CI

on:
  push:
    branches: ['**']
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# One run per ref; newer branch/PR pushes supersede older runs. Tag runs are
# never cancelled because cancellation during upload can leave partial releases.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Prefer Node.js 24 LTS for JavaScript-based Actions. Do not use Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24"

permissions:
  contents: read

jobs:
  # Linux owns repository-wide quality checks and produces release artifacts.
  go:
    name: Go (linux/amd64; build on tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js (LTS 24)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Assert Node.js major version
        run: |
          node -v
          major="$(node -p "process.versions.node.split('.')[0]")"
          test "$major" = "24" || { echo "expected Node 24, got $(node -v)" >&2; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "error: gofmt drift — run 'make fmt':" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Go mod tidy is clean
        run: |
          set -euo pipefail
          cp go.mod /tmp/go.mod.bak
          cp go.sum /tmp/go.sum.bak
          go mod tidy
          if ! diff -q go.mod /tmp/go.mod.bak >/dev/null || ! diff -q go.sum /tmp/go.sum.bak >/dev/null; then
            echo "error: go.mod/go.sum are not tidy — run 'go mod tidy' and commit" >&2
            diff -u /tmp/go.mod.bak go.mod || true
            diff -u /tmp/go.sum.bak go.sum || true
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (cgo-free, all packages)
        run: CGO_ENABLED=0 go test ./...

      - name: Lint
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint" make lint

      - name: Installer (POSIX)
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          tail -n 1 scripts/install.sh | grep -qx 'main "$@"'
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -s sh scripts/install.sh
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
            shellcheck -s sh scripts/install.sh
          fi
          sh scripts/install_test.sh

      - name: Build release binaries
        id: build
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$TAG' is not vX.Y.Z" >&2
            exit 1
          fi
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          make build-all VERSION="$TAG"

          f="dist/mcp-server-magictools-linux-amd64"
          test -f "$f" || { echo "error: missing $f" >&2; exit 1; }
          got="$("./$f" --version 2>&1 | awk '{print $NF}')"
          test "$got" = "$VER" || {
            echo "error: linux-amd64 reports '$got', expected '$VER'" >&2
            exit 1
          }

          for bin in dist/mcp-server-magictools-*; do
            if ! go version -m "$bin" | grep -q '^	build	CGO_ENABLED=0$'; then
              echo "error: $bin is not CGO_ENABLED=0 — refusing to publish" >&2
              go version -m "$bin" | grep -i cgo >&2 || true
              exit 1
            fi
            echo "ok: $bin is cgo-free"
          done

          (
            cd dist
            rm -f SHA256SUMS SHA256SUMS.tmp
            set --
            for f in *; do
              [ -f "$f" ] || continue
              set -- "$@" "$f"
            done
            [ "$#" -gt 0 ] || { echo "no build artifacts to checksum" >&2; exit 1; }
            sha256sum "$@" > SHA256SUMS.tmp
            mv SHA256SUMS.tmp SHA256SUMS
            cat SHA256SUMS
          )
          ls -lh dist/
          {
            echo "### Go binaries"
            echo "Stamped: \`$VER\` from tag \`$TAG\`"
            echo "Platforms: linux/amd64, darwin/arm64, windows/amd64"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Go binaries
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-server-magictools-${{ steps.build.outputs.version || github.sha }}
          path: dist/
          if-no-files-found: error

  # Cross-compiling proves a target links; native execution proves it works.
  go-native:
    name: Go (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, label: darwin/arm64, shell: bash }
          - { runner: windows-2025, label: windows/amd64, shell: bash }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Installer (PowerShell dry run)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & ./scripts/install.ps1 -WhatIf 6>&1 | Out-String
          Write-Host $output
          if ($output -match '(?i)configure|service install') {
            throw 'installer must only place the binary'
          }
          if ($output -notmatch [regex]::Escape('Programs\magictools')) {
            throw 'installer did not report the expected installation directory'
          }

  # Execute tag-built non-Linux binaries on their target operating systems.
  smoke-native:
    name: Smoke (${{ matrix.label }})
    if: github.ref_type == 'tag'
    needs: [go]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, label: darwin/arm64, suffix: darwin-arm64, ext: "" }
          - { runner: windows-2025, label: windows/amd64, suffix: windows-amd64, ext: ".exe" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Download Go binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcp-server-magictools-${{ needs.go.outputs.version || github.sha }}
          path: dist

      - name: Smoke binaries
        shell: bash
        env:
          VER: ${{ needs.go.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          f="dist/mcp-server-magictools-${SUFFIX}${EXT}"
          test -f "$f" || { echo "error: $f missing from the artifact" >&2; exit 1; }
          chmod +x "$f" || true
          got="$("./$f" --version 2>&1 | awk '{print $NF}')"
          test "$got" = "$VER" || {
            echo "error: $f reports '$got', expected '$VER'" >&2; exit 1; }
          echo "ok: $f $got"

  # Publish tag assets only after quality, native tests, and native smoke pass.
  release:
    name: Publish Release assets
    if: github.ref_type == 'tag'
    needs: [go, go-native, smoke-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Go binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcp-server-magictools-${{ needs.go.outputs.version || github.sha }}
          path: go-bin

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The tag is not referenced here any more: the reusable workflow owns
          # release creation, so this step only stages files.
          VER="${{ needs.go.outputs.version || github.sha }}"
          NAME="mcp-server-magictools"

          chmod +x go-bin/"${NAME}"-* || true

          (cd go-bin && sha256sum -c SHA256SUMS)

          for f in go-bin/"${NAME}"-*; do
            if ! go version -m "$f" | grep -q '^	build	CGO_ENABLED=0$'; then
              echo "error: $f is not CGO_ENABLED=0 — refusing to publish" >&2
              go version -m "$f" | grep -i cgo >&2 || true
              exit 1
            fi
            echo "ok: $f is cgo-free"
          done

          f="go-bin/${NAME}-linux-amd64"
          got="$("./$f" --version 2>&1 | awk '{print $NF}')"
          test "$got" = "$VER" || {
            echo "error: linux-amd64 reports version '$got', expected '$VER'" >&2
            exit 1
          }

          # Stage the canonical release exactly as MADR 0005 defines it: the
          # exact platform basenames the build job produced, one SHA256SUMS
          # over them, and the installers as declared extras. Release-time
          # version-suffixed copies and the second manifest are gone.
          mkdir -p staging
          cp -f go-bin/"${NAME}"-* staging/
          rm -f staging/SHA256SUMS
          cp -f go-bin/SHA256SUMS staging/SHA256SUMS
          cp -f scripts/install.sh staging/install.sh
          cp -f scripts/install.ps1 staging/install.ps1

          ls -lh staging/
          cat staging/SHA256SUMS

      - name: Upload the staged release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: magictools-release-${{ github.ref_name }}
          path: staging/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish through mcplib's reusable workflow: it validates the staged file set
  # against the canonical contract, assembles a draft, attests it, publishes it
  # once, and waits for immutability. It never uses --clobber.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish self-update release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: maccavelli/mcplib/.github/workflows/publish-selfupdate-release.yml@8d4d89ff34ff79c1ed65f223cc3d83b3ec0550aa # mcplib v1.4.1
    with:
      artifact-name: magictools-release-${{ github.ref_name }}
      products-json: '["mcp-server-magictools"]'
      platforms-json: '[{"os":"linux","arch":"amd64"},{"os":"darwin","arch":"arm64"},{"os":"windows","arch":"amd64"}]'
      extra-assets-json: '["install.sh","install.ps1"]'
      bridge-release: false
